<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能找文 - 化妆品文章智能检索</title>
    <style>
        :root {
            --brand-red: #C41E3A;
            --brand-red-dark: #A51830;
            --white: #FFFFFF;
            --light-gray: #F8F8F8;
            --dark-gray: #2D2D2D;
            --border-gray: #E5E5E5;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--light-gray);
            color: var(--dark-gray);
            line-height: 1.6;
        }
        
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--border-gray);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--brand-red);
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
        }
        
        .nav-links a {
            color: var(--dark-gray);
            text-decoration: none;
            font-size: 15px;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: var(--brand-red);
        }
        
        .nav-links a.active {
            color: var(--brand-red);
            font-weight: 600;
        }
        
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .search-section {
            background: var(--white);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }
        
        .search-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark-gray);
            margin-bottom: 8px;
            text-align: center;
        }
        
        .search-subtitle {
            font-size: 15px;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid var(--border-gray);
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--brand-red);
        }
        
        .search-btn {
            padding: 16px 32px;
            background: var(--brand-red);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .search-btn:hover {
            background: var(--brand-red-dark);
        }
        
        .search-examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .example-tag {
            padding: 8px 16px;
            background: var(--light-gray);
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .example-tag:hover {
            background: var(--brand-red);
            color: var(--white);
        }
        
        .results-section {
            display: none;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .results-count {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark-gray);
        }
        
        .results-count span {
            color: var(--brand-red);
        }
        
        .sort-info {
            font-size: 14px;
            color: #666;
        }
        
        .article-card {
            background: var(--white);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.04);
            transition: all 0.3s;
        }
        
        .article-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        
        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .article-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark-gray);
            line-height: 1.4;
            flex: 1;
            margin-right: 16px;
        }
        
        .article-title a {
            color: inherit;
            text-decoration: none;
        }
        
        .article-title a:hover {
            color: var(--brand-red);
        }
        
        .add-report-btn {
            padding: 8px 16px;
            background: var(--brand-red);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.3s;
        }
        
        .add-report-btn:hover {
            background: var(--brand-red-dark);
        }
        
        .add-report-btn.added {
            background: #28a745;
        }
        
        .match-reason {
            background: linear-gradient(135deg, #FFF5F5 0%, #FFF 100%);
            border-left: 3px solid var(--brand-red);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 12px;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }
        
        .match-reason-label {
            color: var(--brand-red);
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
        }
        
        .article-meta {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #888;
        }
        
        .article-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .article-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        
        .keyword-tag {
            padding: 4px 10px;
            background: var(--light-gray);
            border-radius: 4px;
            font-size: 12px;
            color: #666;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-gray);
            border-top-color: var(--brand-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .selected-panel {
            position: fixed;
            right: 20px;
            top: 100px;
            width: 280px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 20px;
            display: none;
        }
        
        .selected-panel.show {
            display: block;
        }
        
        .selected-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-gray);
        }
        
        .selected-count {
            color: var(--brand-red);
        }
        
        .selected-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .selected-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-gray);
            font-size: 13px;
        }
        
        .selected-item:last-child {
            border-bottom: none;
        }
        
        .selected-item-title {
            flex: 1;
            margin-right: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .remove-btn {
            color: #999;
            cursor: pointer;
            font-size: 18px;
        }
        
        .remove-btn:hover {
            color: var(--brand-red);
        }
        
        .generate-report-btn {
            width: 100%;
            padding: 12px;
            background: var(--brand-red);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.3s;
        }
        
        .generate-report-btn:hover {
            background: var(--brand-red-dark);
        }
        
        @media (max-width: 768px) {
            .search-box {
                flex-direction: column;
            }
            
            .search-btn {
                width: 100%;
            }
            
            .article-header {
                flex-direction: column;
                gap: 12px;
            }
            
            .add-report-btn {
                width: 100%;
            }
            
            .selected-panel {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                top: auto;
                width: 100%;
                border-radius: 16px 16px 0 0;
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">化妆品文章检索</a>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="articles.html">文章检索</a>
                <a href="smart-search.html" class="active">智能找文</a>
                <a href="report.html">选文报告</a>
                <a href="service.html">定制服务</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <section class="search-section">
            <h1 class="search-title">智能找文</h1>
            <p class="search-subtitle">用自然语言描述你的需求，AI帮你找到最相关的行业文章</p>
            
            <div class="search-box">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput"
                    placeholder="例如：近期化妆品行业最新动态、抗衰老成分研究进展、新规政策解读..."
                >
                <button class="search-btn" onclick="performSearch()">搜索</button>
            </div>
            
            <div class="search-examples">
                <span class="example-tag" onclick="setSearch('近期化妆品行业最新动态')">近期行业动态</span>
                <span class="example-tag" onclick="setSearch('抗衰老成分研究进展')">抗衰老成分</span>
                <span class="example-tag" onclick="setSearch('化妆品新规政策解读')">新规政策</span>
                <span class="example-tag" onclick="setSearch('国货品牌崛起趋势')">国货崛起</span>
                <span class="example-tag" onclick="setSearch('可持续包装发展趋势')">可持续包装</span>
            </div>
        </section>

        <section class="results-section" id="resultsSection">
            <div class="results-header">
                <div class="results-count">找到 <span id="resultCount">0</span> 篇相关文章</div>
                <div class="sort-info">按相关度排序</div>
            </div>
            
            <div id="resultsList"></div>
        </section>

        <div class="loading" id="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p>AI正在分析文章库，请稍候...</p>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">🔍</div>
            <p>没有找到相关文章，请尝试其他关键词</p>
        </div>
    </main>

    <aside class="selected-panel" id="selectedPanel">
        <div class="selected-header">
            已选文章 <span class="selected-count" id="selectedCount">0</span> 篇
        </div>
        <div class="selected-list" id="selectedList"></div>
        <button class="generate-report-btn" onclick="goToReport()">生成选文报告</button>
    </aside>

    <script>
        // API配置
        // API配置 - Cloudflare隧道
        const API_BASE = 'https://api.cosmetic-search.com';
        let selectedArticles = [];

        function setSearch(text) {
            document.getElementById('searchInput').value = text;
            performSearch();
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('请输入搜索内容');
                return;
            }

            // 显示加载状态
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/api/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        limit: 50,
                        offset: 0
                    })
                });

                if (!response.ok) {
                    throw new Error(`API错误: ${response.status}`);
                }

                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                if (data.articles && data.articles.length > 0) {
                    displayResults(data.articles);
                } else {
                    document.getElementById('emptyState').style.display = 'block';
                }
            } catch (error) {
                console.error('搜索失败:', error);
                document.getElementById('loading').style.display = 'none';
                alert('搜索失败，请检查网络连接或稍后重试');
            }
        }

        function displayResults(results) {
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('resultCount').textContent = results.length;
            
            const listHtml = results.map(article => `
                <div class="article-card">
                    <div class="article-header">
                        <h3 class="article-title">
                            <a href="${article.url}" target="_blank">${article.title}</a>
                        </h3>
                        <button 
                            class="add-report-btn ${selectedArticles.find(a => a.id === article.id) ? 'added' : ''}" 
                            onclick="toggleSelect(${article.id}, this)"
                            data-article='${JSON.stringify(article).replace(/'/g, "\\'")}'
                        >
                            ${selectedArticles.find(a => a.id === article.id) ? '已加入' : '加入选文报告'}
                        </button>
                    </div>
                    <div class="match-reason">
                        <div class="match-reason-label">匹配理由</div>
                        ${article.match_reason}
                    </div>
                    <div class="article-meta">
                        <span>📱 ${article.wechat_name}</span>
                        <span>📅 ${article.publish_date}</span>
                    </div>
                    <div class="article-keywords">
                        ${article.keywords.split(',').slice(0, 5).map(k => `<span class="keyword-tag">${k}</span>`).join('')}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('resultsList').innerHTML = listHtml;
        }

        function toggleSelect(articleId, btn) {
            // 从按钮的data属性获取文章数据
            const articleData = btn.getAttribute('data-article');
            const article = JSON.parse(articleData);
            
            const index = selectedArticles.findIndex(a => a.id === articleId);
            
            if (index > -1) {
                selectedArticles.splice(index, 1);
            } else {
                selectedArticles.push(article);
            }
            
            updateSelectedPanel();
            
            // 更新按钮状态
            const isAdded = selectedArticles.find(a => a.id === articleId);
            btn.textContent = isAdded ? '已加入' : '加入选文报告';
            btn.className = `add-report-btn ${isAdded ? 'added' : ''}`;
        }

        function updateSelectedPanel() {
            const panel = document.getElementById('selectedPanel');
            const count = document.getElementById('selectedCount');
            const list = document.getElementById('selectedList');
            
            count.textContent = selectedArticles.length;
            
            if (selectedArticles.length > 0) {
                panel.classList.add('show');
                list.innerHTML = selectedArticles.map(article => `
                    <div class="selected-item">
                        <span class="selected-item-title">${article.title}</span>
                        <span class="remove-btn" onclick="toggleSelect(${article.id})">×</span>
                    </div>
                `).join('');
            } else {
                panel.classList.remove('show');
            }
        }

        function goToReport() {
            if (selectedArticles.length === 0) {
                alert('请先选择文章');
                return;
            }
            // 存储选中文章到localStorage，跳转到报告页面
            localStorage.setItem('selectedArticles', JSON.stringify(selectedArticles));
            window.location.href = 'report.html';
        }

        // 支持回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
