<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
    <title>定制化深度报告 - 化妆品行业洞察</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #F8F8F8; min-height: 100vh; }
        .topbar { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
        .topbar .logo { font-size: 18px; font-weight: 600; color: #2D2D2D; }
        .topbar .logo span { color: #C41E3A; }
        .topbar a.back { font-size: 14px; color: #C41E3A; text-decoration: none; }
        .container { max-width: 720px; margin: 48px auto; padding: 0 20px 60px; }
        .intro { text-align: center; margin-bottom: 36px; }
        .intro h1 { font-family: 'Noto Serif SC', 'Songti SC', serif; letter-spacing: 1px; font-size: 28px; color: #2D2D2D; margin-bottom: 12px; position: relative; padding-bottom: 20px; }
        .intro h1::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 56px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #C41E3A, #F3A9B8); }
        .intro p { font-size: 15px; color: #666; line-height: 1.9; max-width: 620px; margin: 0 auto; }
        .intro p a { color: #C41E3A; text-decoration: none; }
        .intro p a:hover { text-decoration: underline; }
        .panel { background: #fff; border-radius: 14px; border: 1px solid #EFEFEF; box-shadow: 0 1px 1px rgba(0,0,0,0.04), 0 4px 6px rgba(34,42,53,0.03), 0 16px 40px rgba(47,48,55,0.05); padding: 40px; position: relative; overflow: hidden; }
        .panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #C41E3A, #F3A9B8); }
        .panel h2 { font-family: 'Noto Serif SC', 'Songti SC', serif; letter-spacing: 1px; font-size: 20px; color: #2D2D2D; margin-bottom: 6px; }
        .panel .desc { font-size: 14px; color: #666; margin-bottom: 26px; line-height: 1.7; }
        .field { margin-bottom: 20px; }
        .field > label { display: block; font-size: 14px; color: #2D2D2D; font-weight: 500; margin-bottom: 8px; }
        .field .req { color: #C41E3A; }
        .field .opt { font-weight: 400; color: #999; font-size: 12px; }
        .field input[type=text], .field input[type=email], .field textarea { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; transition: border-color .3s, box-shadow .3s; background: #fff; color: #2D2D2D; }
        .field input:focus, .field textarea:focus { border-color: #C41E3A; box-shadow: 0 0 0 2px rgba(196,30,58,0.1); }
        .field textarea { resize: vertical; min-height: 110px; line-height: 1.7; }
        .field .hint { font-size: 12px; color: #999; margin-top: 6px; }
        .row { display: flex; gap: 14px; flex-wrap: wrap; }
        .row .field { flex: 1; min-width: 200px; }
        .btn-submit { width: 100%; padding: 14px; background: #C41E3A; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; letter-spacing: 2px; transition: all .3s cubic-bezier(.2,.7,.3,1); }
        .btn-submit:hover:not(:disabled) { background: #A51830; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(196,30,58,0.25); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 16px; padding: 14px 18px; border-radius: 8px; font-size: 14px; display: none; line-height: 1.8; }
        .msg.err { display: block; background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }

        .success-panel { display: none; text-align: center; padding: 60px 36px; }
        .success-panel.show { display: block; }
        .success-panel .icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(196,30,58,0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .success-panel h2 { font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 22px; color: #2D2D2D; margin-bottom: 12px; }
        .success-panel .order-no { display: inline-block; font-size: 19px; font-weight: 700; color: #C41E3A; letter-spacing: 1px; background: #FDF2F4; border: 1px dashed #E8A0AC; border-radius: 8px; padding: 8px 22px; margin: 8px 0 16px; }
        .success-panel p { font-size: 14px; color: #666; line-height: 1.9; }
        .success-panel .btn-again { margin-top: 22px; display: inline-block; padding: 10px 28px; border: 1px solid #C41E3A; color: #C41E3A; border-radius: 8px; font-size: 14px; cursor: pointer; background: #fff; transition: all .3s; }
        .success-panel .btn-again:hover { background: #C41E3A; color: #fff; }

        @media (max-width: 640px) {
            .topbar { padding: 0 16px; }
            .container { margin: 28px auto; padding: 0 14px 48px; }
            .panel { padding: 26px 20px; }
            .intro h1 { font-size: 23px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">化妆品行业<span>洞察平台</span></div>
        <a class="back" href="index.html">← 返回首页</a>
    </div>
    <div class="container">
        <div class="intro">
            <h1><svg viewBox="0 0 24 24" style="width:26px;height:26px;vertical-align:-4px;margin-right:10px" fill="none" stroke="#C41E3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>定制化深度报告</h1>
            <p>描述您想要的报告与依据内容，我们为您深度定制生成。依据不限于本站收录范围，可提供链接或资料说明。<br>如需基于本站已收录文章快速生成事实汇编或综合概述，请使用 <a href="report.html">智能选文报告</a>。</p>
        </div>

        <div class="panel" id="formPanel">
            <h2>提交定制需求</h2>
            <div class="desc">填写您的报告需求，我们将在 24 小时内与您联系确认细节。</div>
            <form id="svcForm" novalidate>
                <div class="field">
                    <label>报告需求描述 <span class="req">*</span></label>
                    <textarea id="requirement" placeholder="请描述您想要什么样的报告（如竞品分析、趋势研判、政策解读等）"></textarea>
                </div>
                <div class="field">
                    <label>依据内容说明 <span class="req">*</span></label>
                    <textarea id="basis" placeholder="请说明希望我们根据哪些内容生成报告（可以是链接、资料描述等，不限于本站收录范围）"></textarea>
                </div>
                <div class="row">
                    <div class="field">
                        <label>您的称呼 <span class="req">*</span></label>
                        <input type="text" id="contactName" placeholder="怎么称呼您">
                    </div>
                    <div class="field">
                        <label>联系邮箱 <span class="req">*</span></label>
                        <input type="email" id="contactEmail" placeholder="name@example.com">
                    </div>
                </div>
                <div class="field">
                    <label>微信 / 电话 <span class="opt">（选填）</span></label>
                    <input type="text" id="contactOther" placeholder="便于更快联系您">
                </div>
                <div class="field">
                    <label>补充说明 <span class="opt">（选填）</span></label>
                    <textarea id="notes" style="min-height:80px" placeholder="其他任何需要补充的信息"></textarea>
                    <div class="hint">您的联系信息仅用于本次需求沟通与报告交付，不会用于其他用途。</div>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">提交定制需求</button>
                <div class="msg" id="msg"></div>
            </form>
        </div>

        <div class="panel success-panel" id="successPanel">
            <div class="icon"><svg viewBox="0 0 24 24" style="width:30px;height:30px" fill="none" stroke="#C41E3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
            <h2>需求提交成功</h2>
            <div class="order-no" id="orderNo"></div>
            <p>我们已收到您的定制需求，将在 <strong>24 小时内</strong>通过邮箱与您联系确认细节。<br>请留意查收邮件。</p>
            <button class="btn-again" id="btnAgain">再提交一份需求</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        document.getElementById('svcForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            msg.className = 'msg'; msg.textContent = '';

            const requirement = document.getElementById('requirement').value.trim();
            const basis = document.getElementById('basis').value.trim();
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            if (!requirement) { msg.className = 'msg err'; msg.textContent = '请填写报告需求描述。'; document.getElementById('requirement').focus(); return; }
            if (!basis) { msg.className = 'msg err'; msg.textContent = '请填写依据内容说明。'; document.getElementById('basis').focus(); return; }
            if (!name) { msg.className = 'msg err'; msg.textContent = '请填写您的称呼。'; document.getElementById('contactName').focus(); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.className = 'msg err'; msg.textContent = '请填写有效的联系邮箱。'; document.getElementById('contactEmail').focus(); return; }

            btn.disabled = true; btn.textContent = '提交中...';

            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const refCode = 'SR-' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());

            const payload = {
                ref_code: refCode,
                topic: requirement.slice(0, 200),
                requirement: requirement,
                basis: basis,
                name: name,
                email: email,
                contact: document.getElementById('contactOther').value.trim() || null,
                notes: document.getElementById('notes').value.trim() || null,
            };

            try {
                const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { error } = await sb.from('service_requests').insert(payload);
                if (error) throw error;
                document.getElementById('formPanel').style.display = 'none';
                document.getElementById('orderNo').textContent = '需求单编号：' + refCode;
                document.getElementById('successPanel').classList.add('show');
                document.getElementById('successPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
            } catch (err) {
                msg.className = 'msg err';
                msg.textContent = '提交失败：服务暂未上线，请稍后重试。';
            }
            btn.disabled = false; btn.textContent = '提交定制需求';
        });

        document.getElementById('btnAgain').addEventListener('click', () => {
            document.getElementById('successPanel').classList.remove('show');
            const form = document.getElementById('svcForm');
            form.reset();
            document.getElementById('formPanel').style.display = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
