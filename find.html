<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="data-version" content="v79">
    <title>智能找文 - 化妆品行业洞察平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFFFFF; --surface: #FFFFFF; --panel: #F8F8F8;
            --ink: #2D2D2D; --muted: #8A8A8A;
            --accent: #C41E3A; --accent-hover: #A51830;
            --border: #EFEFEF;
            --serif: 'Noto Serif SC', Georgia, 'Songti SC', 'SimSun', serif;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --spring: cubic-bezier(.34,1.56,.64,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; color: var(--ink); }

        /* ── 顶栏 ── */
        .topbar { padding: 0 48px; height: 68px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); z-index: 10; border-bottom: 1px solid var(--border); }
        .topbar .logo { font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: 1px; }
        .topbar .logo em { color: var(--accent); font-style: normal; }
        .topbar nav a { font-size: 14px; color: var(--muted); text-decoration: none; margin-left: 28px; transition: color .2s; }
        .topbar nav a:hover, .topbar nav a.active { color: var(--accent); }
        .topbar .back { font-size: 14px; color: var(--accent); text-decoration: none; }
        .topbar .back:hover { text-decoration: underline; }

        /* ── 搜索区 ── */
        .search-hero { background: linear-gradient(180deg, #FFFFFF 0%, #FDF9F9 100%); padding: 72px 48px 56px; text-align: center; border-bottom: 1px solid var(--border); }
        .search-inner { max-width: 720px; margin: 0 auto; }
        .search-kicker { font-family: 'Bricolage Grotesque', var(--sans); font-size: 12px; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; margin-bottom: 16px; }
        .search-title { font-family: var(--serif); font-size: 32px; font-weight: 900; margin-bottom: 12px; }
        .search-sub { font-size: 15px; color: var(--muted); margin-bottom: 36px; line-height: 1.7; }
        .search-box { position: relative; max-width: 640px; margin: 0 auto; }
        .search-input { width: 100%; padding: 18px 56px 18px 24px; font-size: 16px; border: 2px solid var(--border); border-radius: 14px; outline: none; transition: all .3s var(--spring); background: var(--surface); }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(196,30,58,0.08); }
        .search-input::placeholder { color: #AAAAAA; }
        .search-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: none; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .25s var(--spring); }
        .search-btn:hover { background: var(--accent-hover); transform: translateY(-50%) scale(1.05); }
        .search-btn svg { width: 20px; height: 20px; }
        .search-examples { margin-top: 20px; font-size: 13px; color: var(--muted); }
        .search-examples a { color: var(--accent); text-decoration: none; margin: 0 6px; }
        .search-examples a:hover { text-decoration: underline; }

        /* ── 结果区 ── */
        .results-section { max-width: 900px; margin: 0 auto; padding: 48px; width: 100%; flex: 1; }
        .results-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .results-count { font-size: 15px; color: var(--ink); }
        .results-count strong { color: var(--accent); font-weight: 700; }
        .results-sort { font-size: 13px; color: var(--muted); }
        .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px 28px; margin-bottom: 16px; transition: all .3s var(--spring); position: relative; overflow: hidden; }
        .result-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), #F3A9B8); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--spring); }
        .result-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.06); border-color: #E5E5E5; }
        .result-card:hover::before { transform: scaleX(1); }
        .result-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
        .result-source { font-size: 12px; color: var(--accent); background: #FBE9EB; padding: 3px 10px; border-radius: 8px; font-weight: 500; }
        .result-date { font-size: 12px; color: var(--muted); }
        .result-score { font-size: 11px; color: #888; background: #F5F5F5; padding: 2px 8px; border-radius: 6px; }
        .result-title { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 10px; line-height: 1.5; }
        .result-title a { color: inherit; text-decoration: none; transition: color .2s; }
        .result-title a:hover { color: var(--accent); }
        .result-reason { font-size: 14px; color: #666; line-height: 1.7; margin-bottom: 16px; padding-left: 12px; border-left: 3px solid #F0F0F0; }
        .result-actions { display: flex; gap: 12px; }
        .btn-add { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--accent); background: #FBE9EB; border: none; border-radius: 8px; cursor: pointer; transition: all .25s var(--spring); }
        .btn-add:hover { background: var(--accent); color: #fff; }
        .btn-add svg { width: 14px; height: 14px; }
        .btn-view { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--border); border-radius: 8px; text-decoration: none; transition: all .25s; }
        .btn-view:hover { border-color: var(--accent); color: var(--accent); }
        
        /* 导入选文报告按钮 */
        .import-section { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); text-align: center; }
        .btn-import { display: inline-block; padding: 14px 32px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all .3s var(--spring); letter-spacing: 0.5px; }
        .btn-import:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(196,30,58,0.25); }
        
        /* 右侧浮动选文面板 */
        .selected-panel { position: fixed; right: 24px; top: 100px; width: 300px; max-height: 60vh; background: #fff; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: none; flex-direction: column; z-index: 100; }
        .selected-panel.show { display: flex; }
        .selected-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .selected-header h3 { font-size: 15px; color: var(--ink); margin: 0; }
        .selected-count { background: var(--accent); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .selected-list { flex: 1; overflow-y: auto; padding: 12px 16px; max-height: 40vh; }
        .selected-item { padding: 10px 12px; margin-bottom: 8px; background: var(--panel); border-radius: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .selected-item .title { flex: 1; color: var(--ink); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .selected-item .remove { color: #999; cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; }
        .selected-item .remove:hover { color: var(--accent); }
        .selected-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
        .btn-import-panel { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .3s; }
        .btn-import-panel:hover { background: var(--accent-hover); }
        .btn-import-panel:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── 空状态 ── */
        .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
        .empty-state svg { width: 64px; height: 64px; stroke: #DDD; margin-bottom: 20px; }
        .empty-state p { font-size: 15px; }

        /* ── 加载状态 ── */
        .loading { text-align: center; padding: 60px 20px; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid #F0F0F0; border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: var(--muted); font-size: 14px; }
        .progress-container { width: 280px; height: 4px; background: #F0F0F0; border-radius: 2px; margin: 20px auto 0; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.3s ease; }

        .footer { text-align: center; padding: 26px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); margin-top: auto; }

        @media (max-width: 768px) {
            .topbar { padding: 0 20px; }
            .search-hero { padding: 48px 20px 40px; }
            .search-title { font-size: 24px; }
            .results-section { padding: 32px 20px; }
            .result-card { padding: 20px; }
            .result-actions { flex-direction: column; }
        }
    </style>

    <script>
    (function(){
        var currentVersion = document.querySelector('meta[name="data-version"]');
        if (currentVersion) {
            var stored = localStorage.getItem('site_data_version');
            if (stored && stored !== currentVersion.content) {
                localStorage.setItem('site_data_version', currentVersion.content);
                location.reload(true);
            } else if (!stored) {
                localStorage.setItem('site_data_version', currentVersion.content);
            }
        }
    })();
    </script>
</head>
<body>
    <div class="topbar">
        <div class="logo">化妆品行业<em>洞察平台</em> · 智能找文</div>
        <a href="index.html" class="back">← 返回首页</a>
    </div>

    <div class="search-hero">
        <div class="search-inner">
            <div class="search-kicker">AI-Powered Search</div>
            <h1 class="search-title">智能找文</h1>
            <p class="search-sub">用自然语言描述您的需求，AI 为您推荐最相关的行业文章</p>
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="例如：近期化妆品行业最新动态、抗衰老成分趋势、新规政策解读…">
                <button class="search-btn" onclick="doSearch()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
            </div>
            <div class="search-examples">
                试试：<a href="#" onclick="setQuery('近期化妆品行业最新动态')">行业动态</a>
                <a href="#" onclick="setQuery('抗衰老成分趋势')">抗衰老</a>
                <a href="#" onclick="setQuery('化妆品新规政策')">政策法规</a>
                <a href="#" onclick="setQuery('国货品牌崛起')">国货品牌</a>
            </div>
        </div>
    </div>

    <div class="results-section" id="resultsSection" style="display: none;">
        <div class="results-header">
            <div class="results-count">找到 <strong id="resultCount">0</strong> 篇相关文章</div>
            <div class="results-sort">按相关度排序</div>
        </div>
        <div id="resultsList"></div>
    </div>

    <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <p>输入您的需求，AI 为您智能推荐相关文章</p>
    </div>

    <div class="loading" id="loadingState" style="display: none;">
        <div class="loading-spinner"></div>
        <p>AI 正在检索相关文章…</p>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- 右侧浮动选文面板 -->
    <div class="selected-panel" id="selectedPanel">
        <div class="selected-header">
            <h3>已选文章</h3>
            <span class="selected-count" id="selectedCount">0</span>
        </div>
        <div class="selected-list" id="selectedList"></div>
        <div class="selected-footer">
            <button class="btn-import-panel" id="btnImportPanel" onclick="importToReport()" disabled>
                一键导入智能选文报告
            </button>
        </div>
    </div>

    <div class="footer">化妆品行业洞察平台 · 智能找文</div>

    <script>
        // API配置 - Cloudflare隧道
        const API_BASE = 'https://api.cosmetic-search.com';
        let selectedArticles = [];
        let articleMap = {}; // 全局文章数据映射，避免HTML属性转义问题

        function setQuery(q) {
            document.getElementById('searchInput').value = q;
            doSearch();
        }

        async function doSearch() {
            var query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('loadingState').style.display = 'block';
            
            // 进度条匀速动画（预估50秒，匀速到95%，API返回后跳100%）
            var progressBar = document.getElementById('progressBar');
            var progress = 0;
            var ESTIMATED_MS = 90000; // 预估总耗时90秒（召回多时LLM精排耗时较长）
            var startTime = Date.now();
            var progressInterval = setInterval(function() {
                var elapsed = Date.now() - startTime;
                progress = Math.min(95, (elapsed / ESTIMATED_MS) * 100);
                progressBar.style.width = progress + '%';
            }, 200);

            try {
                const response = await fetch(`${API_BASE}/api/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        limit: 50,
                        offset: 0
                    })
                });

                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                if (!response.ok) {
                    throw new Error(`API错误: ${response.status}`);
                }

                const data = await response.json();
                
                document.getElementById('loadingState').style.display = 'none';
                
                if (data.articles && data.articles.length > 0) {
                    showResults(data.articles);
                } else {
                    document.getElementById('emptyState').style.display = 'block';
                }
            } catch (error) {
                console.error('搜索失败:', error);
                document.getElementById('loadingState').style.display = 'none';
                alert('搜索失败，请检查网络连接或稍后重试');
            }
        }

        function showResults(results) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('resultCount').textContent = results.length;

            var html = '';
            articleMap = {}; // 清空并重建映射
            results.forEach(function(r) {
                articleMap[r.id] = r; // 存入全局映射
                var score = r.score || r.llm_score || 0;
                var scorePercent = Math.min(100, Math.max(0, Math.round(score)));
                
                html += '<div class="result-card">' +
                    '<div class="result-meta">' +
                        '<span class="result-source">' + (r.wechat_name || r.source) + '</span>' +
                        '<span class="result-date">' + (r.publish_date || r.date) + '</span>' +
                        '<span class="result-score">相关度 ' + scorePercent + '%</span>' +
                    '</div>' +
                    '<div class="result-title"><a href="' + r.url + '" target="_blank">' + r.title + '</a></div>' +
                    '<div class="result-reason">' + (r.match_reason || r.reason || '本文内容与您的搜索查询相关。') + '</div>' +
                    '<div class="result-actions">' +
                        '<button class="btn-add" onclick="addToReport(' + r.id + ', this)">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>' +
                            '加入选文报告' +
                        '</button>' +
                        '<a href="' + r.url + '" target="_blank" class="btn-view">查看原文 →</a>' +
                    '</div>' +
                '</div>';
            });
            document.getElementById('resultsList').innerHTML = html;
        }

        function addToReport(id, btn) {
            const article = articleMap[id];
            if (!article) return;
            
            const index = selectedArticles.findIndex(a => a.id === id);
            
            if (index > -1) {
                selectedArticles.splice(index, 1);
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>加入选文报告';
            } else {
                selectedArticles.push(article);
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>已加入';
            }
            
            // 更新右侧面板
            updateSelectedPanel();
        }
        
        function updateSelectedPanel() {
            var panel = document.getElementById('selectedPanel');
            var list = document.getElementById('selectedList');
            var count = document.getElementById('selectedCount');
            var btn = document.getElementById('btnImportPanel');
            
            count.textContent = selectedArticles.length;
            
            if (selectedArticles.length > 0) {
                panel.classList.add('show');
                btn.disabled = false;
                btn.textContent = '一键导入智能选文报告 (' + selectedArticles.length + '篇)';
                
                list.innerHTML = selectedArticles.map(function(a, i) {
                    return '<div class="selected-item">' +
                        '<span class="title">' + (a.title || '无标题') + '</span>' +
                        '<span class="remove" onclick="removeSelected(' + i + ')">×</span>' +
                    '</div>';
                }).join('');
            } else {
                panel.classList.remove('show');
                btn.disabled = true;
            }
        }
        
        function removeSelected(index) {
            selectedArticles.splice(index, 1);
            updateSelectedPanel();
            
            // 同时更新结果列表中的按钮状态
            var buttons = document.querySelectorAll('.btn-add');
            buttons.forEach(function(btn) {
                var onclickAttr = btn.getAttribute('onclick');
                var match = onclickAttr ? onclickAttr.match(/addToReport\((\d+)/) : null;
                if (match) {
                    var articleId = parseInt(match[1]);
                    var stillSelected = selectedArticles.some(function(a) { return a.id === articleId; });
                    if (!stillSelected) {
                        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>加入选文报告';
                    }
                }
            });
        }
        
        function importToReport() {
            if (selectedArticles.length === 0) return;
            
            // 将选中文献存储到sessionStorage，供report.html读取
            sessionStorage.setItem('selectedArticles', JSON.stringify(selectedArticles));
            
            // 跳转到智能选文报告页面
            window.location.href = 'report.html';
        }

        // 回车搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>
